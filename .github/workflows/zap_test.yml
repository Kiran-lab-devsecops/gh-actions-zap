- name: Checkout repository
  uses: actions/checkout@v4

- name: Build and Run Docker Container
  run: |
    docker build -t vulnerable-app .
    docker run -d --name vuln-app -p 5050:5050 vulnerable-app
    sleep 30

- name: Authenticate and Prepare ZAP Context
  run: |
    # Login to get auth token
    AUTH_RESPONSE=$(curl -s -X POST http://localhost:5050/login \
      -H "Content-Type: application/json" \
      -d '{"username":"admin","password":"admin123"}')
    
    AUTH_TOKEN=$(echo $AUTH_RESPONSE | jq -r '.Authorization // .token // empty')
    echo "AUTH_TOKEN=$AUTH_TOKEN" >> $GITHUB_ENV
    
    # Save auth for ZAP to use
    echo $AUTH_TOKEN > /tmp/auth_token.txt

- name: ZAP Scan with Authentication
  uses: zaproxy/action-full-scan@v0.13.0
  env:
    AUTH_HEADER: ${{ env.AUTH_TOKEN }}
  with:
    target: 'http://localhost:5050'
    docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
    cmd_options: |
      -m 10
      -M 6
      -a
      -j
